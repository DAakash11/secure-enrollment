spring.application.name=qsec
spring.datasource.url=jdbc:postgresql://localhost:5432/qsec
spring.datasource.username=qsec_app
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

hsm.config-path=hsm/softhsm-java.cfg
hsm.pin=${HSM_PIN}

# --- HTTPS + mTLS on 8443 ---
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=tls/server.p12
server.ssl.key-store-password=${TLS_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.trust-store=tls/truststore.p12
server.ssl.trust-store-password=${TLS_TRUSTSTORE_PASSWORD}
server.ssl.trust-store-type=PKCS12
server.ssl.client-auth=need
